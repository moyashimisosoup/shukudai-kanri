<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>共有データの手動削除</title>
<style>
body{max-width:860px;margin:28px auto;padding:0 18px;font:16px/1.6 system-ui,sans-serif;color:#233;background:#faf9f5}h1{font-size:24px}textarea,input,button{font:inherit}textarea{box-sizing:border-box;width:100%;min-height:150px;padding:10px}button{padding:9px 14px;margin:10px 8px 10px 0;border:1px solid #567;border-radius:7px;background:#fff}button.danger{background:#9c3030;color:#fff;border-color:#9c3030}.note{padding:12px 14px;background:#fff3d5;border:1px solid #d99f35;border-radius:8px}.error{color:#a00;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:12px;background:#fff}th,td{padding:7px;border:1px solid #ddd;text-align:left;font-size:13px;word-break:break-all}th{background:#eef4f6}label{display:block;margin-top:12px}code{font-size:13px}
</style>
<h1>共有データの手動削除</h1>
<p class="note">この画面は管理者のPCだけで <code>127.0.0.1</code> に開きます。共有ID（Firestoreの64桁文書ID）を貼り付け、まず確認してください。削除は「墓標の作成」と「共有データ本体の削除」を同時に実行します。元に戻せません。</p>
<label>共有ID（改行・空白区切り）<textarea id="ids" placeholder="64桁の共有IDを貼り付け"></textarea></label>
<button id="inspect">削除候補を確認</button><span id="out" role="status"></span>
<div id="results"></div>
<label><input id="early" type="checkbox"> 90日未満のIDも削除対象にする</label>
<label>確認のため <code id="confirmHint">削除 0 件</code> と入力<input id="confirm" autocomplete="off"></label>
<button class="danger" id="retire">墓標を作成して削除</button>
<script>
const $=s=>document.querySelector(s); const out=$('#out');
const ids=()=>$('#ids').value;
async function call(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw new Error(v.error||'失敗しました');return v}
function count(){return [...new Set((ids().toLowerCase().match(/[0-9a-f]{64}/g)||[]))].length}
function show(rows){$('#confirmHint').textContent='削除 '+count()+' 件';$('#results').innerHTML=rows.length?'<table><tr><th>共有ID</th><th>状態</th><th>最終活動</th><th>判定</th></tr>'+rows.map(r=>'<tr><td>'+r.id+'</td><td>'+(!r.exists?'本体なし':r.deleting?'削除処理中':'利用中')+'</td><td>'+ (r.activityAt||'不明')+'</td><td>'+r.reason+(r.remainingDays!==undefined?'（残り '+r.remainingDays+'日）':'')+'</td></tr>').join('')+'</table>':'<p>対象がありません。</p>'}
$('#inspect').onclick=async()=>{out.textContent='確認中…';try{const v=await call('/api/inspect',{ids:ids()});show(v.rows);out.textContent='確認しました';out.className=''}catch(e){out.textContent=e.message;out.className='error'}};
$('#retire').onclick=async()=>{if(!confirm('対象の共有データを削除します。元に戻せません。続けますか？'))return;out.textContent='削除中…';try{const v=await call('/api/retire',{ids:ids(),confirm:$('#confirm').value,allowEarly:$('#early').checked});out.textContent=v.deleted.length+'件を削除しました。'+(v.skipped.length?' '+v.skipped.length+'件は対象外です。':'');out.className='';show(await (await call('/api/inspect',{ids:ids()})).rows)}catch(e){out.textContent=e.message;out.className='error'}};
</script>
