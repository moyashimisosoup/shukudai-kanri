<!DOCTYPE html>
<html lang="ja" data-theme="notebook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-version" content="1.3.21">
<meta name="theme-color" content="#14375E">
<!-- 招待リンクは ホーム画面に 追加させるため、しばらく URL に あいことばを のこす。
     そのあいだ 外部（Google Fonts など）へ アドレスを 渡さない。
     いまの ブラウザの 既定でも クエリは 出ないが、古い端末では 出る -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest?v=20260812d">
<!-- iOS は manifest の icons を 読むが、apple-touch-icon が あれば そちらが 勝つ。
     透過の PNG／SVG は 黒で うめられるので、不透明の 180×180 を 用意する -->
<link rel="apple-touch-icon" href="assets/icon-180.png?v=20260812c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="なつやすみ">
<title>はじめ夏休みの宿題一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Webフォントの通信で初期描画を止めない。読み込み中は端末内の丸ゴシックを使う -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="assets/style.css?v=20260817d">
<link rel="stylesheet" href="tokens.css?v=20260813a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
</head>
<body>

<header class="topband">
  <div class="topband-inner">
    <span class="topband-mark" aria-hidden="true"></span>
    <h1 class="topband-title" id="appTitle">はじめ夏休みの宿題一覧</h1>
    <button class="topband-date" id="todayLabel" type="button" aria-haspopup="dialog" aria-controls="kinenbiDialog" aria-expanded="false">
      <span id="todayLabelText"></span><span class="topband-date-dot" aria-hidden="true"></span>
    </button>
  </div>
</header>

<!-- スクロールするのは この中だけ。上帯と下タブは動かないので、
     iPad の Safari で fixed が ずれる問題が おきない -->
<div class="scroll" id="scroll">
  <main id="view" class="view" tabindex="-1">
    <section class="boot-progress" id="bootProgress" role="status" aria-live="polite">
      <p><strong>読み込み中…</strong><span id="bootPercent">10%</span></p>
      <div class="boot-track" id="bootTrack" role="progressbar" aria-label="アプリの読み込み" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><i id="bootBar" style="width:10%"></i></div>
      <small id="bootLabel">画面を準備しています</small>
    </section>
  </main>
</div>

<!-- 今日はなんの日？ -->
<dialog class="kinenbi-dialog" id="kinenbiDialog" aria-labelledby="kinenbiTitle">
  <div class="kinenbi-head">
    <span class="kinenbi-date" id="kinenbiDate"></span>
    <h2 id="kinenbiTitle"></h2>
  </div>
  <p class="kinenbi-text" id="kinenbiText"></p>
  <button class="btn btn-go kinenbi-close" id="kinenbiClose" type="button">とじる</button>
</dialog>

<nav class="tabbar" aria-label="メニュー">
  <button class="tab is-on" data-tab="home" type="button">
    <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4Z"/><path d="M9 20v-5h6v5"/></svg></span><span class="tab-txt">のこりの<br class="tab-break">しゅくだい</span>
  </button>
  <button class="tab" data-tab="log" type="button">
    <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5c3.2-1.4 5.8-.8 8 1.6 2.2-2.4 4.8-3 8-1.6V19c-3.2-1.4-5.8-.8-8 1.6-2.2-2.4-4.8-3-8-1.6Z"/><path d="M12 7.1V20.6M6.8 9.2h2.6m-2.6 3h2.6m5.2-3h2.6m-2.6 3h2.6"/></svg></span><span class="tab-txt">やった<br class="tab-break">こと</span>
  </button>
  <button class="tab" data-tab="calendar" type="button">
    <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M7.5 3.8v3.4m9-3.4v3.4M4 10h16M8 13.5h.1m3.9 0h.1m3.9 0h.1M8 16.6h.1m3.9 0h.1m3.9 0h.1"/></svg></span><span class="tab-txt">カレンダー</span>
  </button>
</nav>

<!-- きろくシート -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="とじる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="sheetCancel" type="button">やめる</button>
      <button class="btn btn-go" id="sheetSave" type="button">きろくする</button>
    </div>
  </section>
</div>

<!-- できた！のはんこ -->
<div class="stamp" id="stamp" hidden aria-hidden="true">
  <div class="stamp-mark"><span id="stampText">できた！</span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 招待QRは端末内のカメラ映像だけで読む。映像や画像を保存・送信しない。 -->
<dialog class="qr-scan-dialog" id="qrScanDialog" aria-labelledby="qrScanTitle" aria-describedby="qrScanNote">
  <div class="qr-scan-head">
    <h2 id="qrScanTitle">QRコードを読み取る</h2>
    <button class="qr-scan-close" id="qrScanClose" type="button" aria-label="QRコードの読み取りを閉じる">×</button>
  </div>
  <div class="qr-scan-view">
    <video id="qrScanVideo" playsinline muted></video>
    <canvas id="qrScanCanvas" hidden></canvas>
    <div class="qr-scan-frame" aria-hidden="true"></div>
  </div>
  <p class="qr-scan-note" id="qrScanNote">ほかの端末に表示した招待QRを枠の中に入れてください。映像はこの端末だけで処理します。</p>
  <p class="qr-scan-status" id="qrScanStatus" role="status" aria-live="polite"></p>
  <div class="qr-scan-actions">
    <button class="btn btn-sm btn-ghost" id="qrScanCancel" type="button">やめる</button>
    <button class="btn btn-sm btn-go" id="qrScanConnect" type="button" hidden>接続先を確認する</button>
  </div>
</dialog>

<script>
window.natsuBootProgress = function(value, label){
  var root = document.getElementById('bootProgress');
  if(!root) return;
  var percent = Math.max(0, Math.min(100, Number(value) || 0));
  document.getElementById('bootPercent').textContent = percent + '%';
  document.getElementById('bootBar').style.width = percent + '%';
  document.getElementById('bootTrack').setAttribute('aria-valuenow', String(percent));
  document.getElementById('bootLabel').textContent = label || '読み込んでいます';
};
</script>
<script src="assets/kanji.js?v=20260813a"></script>
<script>window.natsuBootProgress(25, '文字の表示を準備しています');</script>
<script src="assets/codex-icons.js?v=0.3.4b"></script>
<script src="assets/kanji-origin.js?v=20260809d"></script>
<script>window.natsuBootProgress(40, '画面の部品を準備しています');</script>
<script src="assets/data.js?v=20260814b"></script>
<script>window.natsuBootProgress(55, '宿題の項目を読み込んでいます');</script>
<!-- まねきリンクを QR にするだけの 同梱ライブラリ（MIT）。
     外に つなぎに いかないので、圏外でも QR が 出る。
     読めなくても inviteHTML() が QR を 出さずに 進むだけ -->
<script src="assets/vendor/qrcode.js?v=2.0.4"></script>
<script src="assets/vendor/jsqr.js?v=1.4.0"></script>
<script>window.natsuBootProgress(75, '共有の準備をしています');</script>
<script>window.natsuBootProgress(88, 'この端末の記録を読み込んでいます');</script>
<script src="assets/app.js?v=20260817d"></script>
<!-- 端末間の共有。module なので app.js のあとに動く。
     読めなくても・未設定でも アプリは localStorage だけで そのまま動く -->
<script type="module" src="assets/sync.js?v=20260816b"></script>
<!-- Cloudflare Web Analytics: 利用者画面には表示せず、匿名のアクセス状況だけを計測する -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "4844611a6258456f866196574e92a9e3"}'></script>
</body>
</html>
