<!DOCTYPE html>
<html lang="ja" data-theme="notebook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14375E">
<!-- 招待リンクは ホーム画面に 追加させるため、しばらく URL に あいことばを のこす。
     そのあいだ 外部（Google Fonts など）へ アドレスを 渡さない。
     いまの ブラウザの 既定でも クエリは 出ないが、古い端末では 出る -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest?v=20260810z">
<!-- iOS は manifest の icons を 読むが、apple-touch-icon が あれば そちらが 勝つ。
     透過の PNG／SVG は 黒で うめられるので、不透明の 180×180 を 用意する -->
<link rel="apple-touch-icon" href="assets/icon-180.png?v=20260810b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="なつやすみ">
<title>はじめ夏休みの宿題一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20260811b">
<link rel="stylesheet" href="tokens.css?v=20260808l">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
</head>
<body>

<header class="topband">
  <div class="topband-inner">
    <span class="topband-mark" aria-hidden="true"></span>
    <h1 class="topband-title" id="appTitle">はじめ夏休みの宿題一覧</h1>
    <span class="topband-date" id="todayLabel"></span>
  </div>
</header>

<!-- スクロールするのは この中だけ。上帯と下タブは動かないので、
     iPad の Safari で fixed が ずれる問題が おきない -->
<div class="scroll" id="scroll">
  <main id="view" class="view" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="メニュー">
  <button class="tab is-on" data-tab="home" type="button">
    <span class="tab-ico" aria-hidden="true">🏠</span><span class="tab-txt">のこりの<br class="tab-break">しゅくだい</span>
  </button>
  <button class="tab" data-tab="log" type="button">
    <span class="tab-ico" aria-hidden="true">📖</span><span class="tab-txt">やった<br class="tab-break">こと</span>
  </button>
  <button class="tab" data-tab="calendar" type="button">
    <span class="tab-ico" aria-hidden="true">🗓️</span><span class="tab-txt">カレンダー</span>
  </button>
</nav>

<!-- きろくシート -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="とじる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="sheetCancel" type="button">やめる</button>
      <button class="btn btn-go" id="sheetSave" type="button">きろくする</button>
    </div>
  </section>
</div>

<!-- できた！のはんこ -->
<div class="stamp" id="stamp" hidden aria-hidden="true">
  <div class="stamp-mark"><span id="stampText">できた！</span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/kanji.js?v=20260808d"></script>
<script src="assets/codex-icons.js?v=0.3.4"></script>
<script src="assets/kanji-origin.js?v=20260809d"></script>
<script src="assets/data.js?v=20260811c"></script>
<!-- まねきリンクを QR にするだけの 同梱ライブラリ（MIT）。
     外に つなぎに いかないので、圏外でも QR が 出る。
     読めなくても inviteHTML() が QR を 出さずに 進むだけ -->
<script src="assets/vendor/qrcode.js?v=2.0.4"></script>
<script src="assets/app.js?v=20260811c"></script>
<!-- 端末間の共有。module なので app.js のあとに動く。
     読めなくても・未設定でも アプリは localStorage だけで そのまま動く -->
<script type="module" src="assets/sync.js?v=20260811b"></script>
</body>
</html>
